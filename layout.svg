<rect x="832" y="158" width="80" height="80" rx="10" fill="#2F6FDF"/>
<text x="840" y="176" font-size="14" fill="#fff" opacity="0.8">;</text>
<text x="872.0" y="208" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">は行</text>
<rect x="60" y="246" width="80" height="80" rx="10" fill="#8A8A8A"/>
<text x="68" y="264" font-size="14" fill="#fff" opacity="0.8">Z</text>
<text x="100.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">記号</text>
<text x="100.0" y="316" font-size="12" text-anchor="middle" fill="#fff">矢印・『』…</text>
<rect x="148" y="246" width="80" height="80" rx="10" fill="#8A8A8A"/>
<text x="156" y="264" font-size="14" fill="#fff" opacity="0.8">X</text>
<text x="188.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">小書き</text>
<text x="188.0" y="316" font-size="12" text-anchor="middle" fill="#fff">っ ぁ ゃ</text>
<rect x="236" y="246" width="80" height="80" rx="10" fill="#F05033"/>
<text x="244" y="264" font-size="14" fill="#fff" opacity="0.8">C</text>
<text x="276.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">ー</text>
<text x="276.0" y="316" font-size="12" text-anchor="middle" fill="#fff">長音</text>
<rect x="324" y="246" width="80" height="80" rx="10" fill="#7A9FE8"/>
<text x="332" y="264" font-size="14" fill="#fff" opacity="0.8">V</text>
<text x="364.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">ゔ行</text>
<rect x="412" y="246" width="80" height="80" rx="10" fill="#2F6FDF"/>
<text x="420" y="264" font-size="14" fill="#fff" opacity="0.8">B</text>
<text x="452.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">ら行</text>
<rect x="500" y="246" width="80" height="80" rx="10" fill="#2F6FDF"/>
<text x="508" y="264" font-size="14" fill="#fff" opacity="0.8">N</text>
<text x="540.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">ん</text>
<rect x="588" y="246" width="80" height="80" rx="10" fill="#2F6FDF"/>
<text x="596" y="264" font-size="14" fill="#fff" opacity="0.8">M</text>
<text x="628.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">わ行</text>
<text x="628.0" y="316" font-size="12" text-anchor="middle" fill="#fff">ふぁ行</text>
<rect x="676" y="246" width="80" height="80" rx="10" fill="#D8D8D8"/>
<text x="684" y="264" font-size="14" fill="#555" opacity="0.8">,</text>
<text x="716.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#555">、</text>
<rect x="764" y="246" width="80" height="80" rx="10" fill="#D8D8D8"/>
<text x="772" y="264" font-size="14" fill="#555" opacity="0.8">.</text>
<text x="804.0" y="296" font-size="22" font-weight="bold" text-anchor="middle" fill="#555">。</text>
<rect x="20" y="345" width="18" height="18" rx="4" fill="#F05033"/><text x="46" y="360" font-size="15" fill="#333">母音（単打）</text>
<rect x="225" y="345" width="18" height="18" rx="4" fill="#2F6FDF"/><text x="251" y="360" font-size="15" fill="#333">子音（清音）</text>
<rect x="430" y="345" width="18" height="18" rx="4" fill="#7A9FE8"/><text x="456" y="360" font-size="15" fill="#333">子音（濁音・半濁音）</text>
<rect x="635" y="345" width="18" height="18" rx="4" fill="#E8A33A"/><text x="661" y="360" font-size="15" fill="#333">や行 / 拗音（2打目）</text>
<rect x="840" y="345" width="18" height="18" rx="4" fill="#8A8A8A"/><text x="866" y="360" font-size="15" fill="#333">前置キー</text>
<text x="20" y="400" font-size="15" fill="#333">子音 + 母音 で 1 文字（例 H A = か）。子音 + Q/W/E/R/T で拗音（H E = きゅ）、Q・E を重ねると長音つき（H E E = きゅう）。</text>
</svg>