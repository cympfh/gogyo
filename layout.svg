<text x="224" y="176" font-size="14" fill="#fff" opacity="0.8">D</text>
<text x="256.0" y="208" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">う</text>
<rect x="304" y="158" width="80" height="80" rx="10" fill="#F05033"/>
<text x="312" y="176" font-size="14" fill="#fff" opacity="0.8">F</text>
<text x="344.0" y="208" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">え</text>
<rect x="392" y="158" width="80" height="80" rx="10" fill="#F05033"/>
<text x="400" y="176" font-size="14" fill="#fff" opacity="0.8">G</text>
<text x="432.0" y="208" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">お</text>
<rect x="480" y="158" width="80" height="80" rx="10" fill="#2F6FDF"/>
<text x="488" y="176" font-size="14" fill="#fff" opacity="0.8">H</text>
